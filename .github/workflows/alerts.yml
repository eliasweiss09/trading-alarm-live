name: Trading alerts

# Public repository: GitHub Actions minutes are free. The ntfy topic and the
# SEC contact live only in the repository secrets NTFY_TOPIC and SEC_USER_AGENT.
#
# GitHub cron runs in UTC. Each slot appears twice so it hits the same
# New York time in summer and winter; alert.py skips the run that is off.
#   8:15 New York  pre-market lists                  12:15 / 13:15 UTC
#   9:55 New York  breakouts, then sell checks every minute until 13:00
#                                                    13:55 / 14:55 UTC
#  13:00 New York  sell checks every minute until 16:00. The morning run starts
#                  this one itself (no delay). The 16:55 / 17:55 UTC slots are a
#                  fallback in case that hand-off fails.
# GitHub often starts scheduled runs 45 minutes late or more, so alert.py
# accepts wide windows and skips a list that already went out.
on:
  schedule:
    - cron: "15 12,13 * * 1-5"
    - cron: "55 13,14 * * 1-5"
    - cron: "55 16,17 * * 1-5"
  push:
    branches: [main]   # each upload sends one test push
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, premarket, open, growth, test or afternoon"
        default: "test"

# One alert run at a time, so two runs never send the same alert.
# Test pushes run on their own.
concurrency:
  group: ${{ github.event_name == 'push' && format('test-{0}', github.run_id) || 'alerts' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # the morning run starts the afternoon run

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ACCOUNTS: ${{ secrets.ACCOUNTS }}   # money and loss limits per account, kept private
      AFTERNOON: ${{ github.event.schedule == '55 16,17 * * 1-5' || github.event.inputs.mode == 'afternoon' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: New York date
        id: day
        run: echo "day=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      # The breakout list is kept for the day so the afternoon sell checks know it.
      - uses: actions/cache/restore@v4
        with:
          path: trader/today.json
          key: today-${{ steps.day.outputs.day }}

      # Pelosi reports already pushed and her latest trade per ticker, kept from run to run.
      - uses: actions/cache/restore@v4
        with:
          path: trader/state/pelosi-seen.json
          key: pelosi-${{ github.run_id }}
          restore-keys: pelosi-
      - name: Install the PDF reader (Pelosi reports)
        if: github.event.schedule == '15 12,13 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: sudo apt-get install -y -qq poppler-utils > /dev/null

      - name: Lists and breakouts
        if: env.AFTERNOON != 'true'
        env:
          MODE: >-
            ${{ github.event_name == 'push' && 'test' || github.event.inputs.mode || 'auto' }}
        run: python alert.py --mode "$MODE"
      - uses: actions/cache/save@v4
        if: >-
          ${{ !cancelled() && hashFiles('trader/state/pelosi-seen.json') != '' &&
          (github.event.schedule == '15 12,13 * * 1-5' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        with:
          path: trader/state/pelosi-seen.json
          key: pelosi-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: hashFiles('trader/opened.flag') != ''
        continue-on-error: true
        with:
          path: trader/today.json
          key: today-${{ steps.day.outputs.day }}
      - name: Sell checks every minute until 13:00 New York
        if: hashFiles('trader/opened.flag') != ''
        run: python alert.py --mode watch --until 13:00
      - name: Start the afternoon sell checks
        if: ${{ !cancelled() && hashFiles('trader/opened.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alerts.yml --ref "${{ github.ref_name }}" -f mode=afternoon

      - name: Sell checks every minute until 16:00 New York
        if: env.AFTERNOON == 'true'
        run: python alert.py --mode watch --until 16:00 --start-between 11:00-15:55
